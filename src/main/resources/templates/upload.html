<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファイルアップロード</title>

    <link rel="stylesheet" th:href="@{/css/upload.css}">
    <script th:src="@{/js/upload.js}" defer></script>
</head>
<body>
<main class="app">
    <header class="header">
        <div class="logo">UP</div>
        <div>
            <h1>ファイルアップロード</h1>
            <p>アップロードするファイルを選択してください。</p>
        </div>
    </header>

    <section class="upload-card">
        <div class="card-heading">
            <h2>ファイル選択</h2>
            <span class="file-count" id="fileCount">0個選択</span>
        </div>
        <div class="savePath">保存されたファイルは C:\0_Excel_Converted でご確認いただけます。</div>

        <div class="drop-zone" id="dropZone">
            <input
                    type="file"
                    id="fileInput"
                    name="file"
                    accept=".zip"
                    hidden
            >

            <div class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none">
                    <path
                            d="M24 31V9m0 0-8 8m8-8 8 8"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    />
                    <path
                            d="M10 29v8a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-8"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                    />
                </svg>
            </div>

            <h3>ファイルをここにドラッグ＆ドロップしてください</h3>
            <p>または下のボタンを押してファイルを選択してください。</p>

            <button
                    type="button"
                    class="select-button"
                    id="selectButton"
            >
                ファイル選択
            </button>

            <p class="hint">ZIPファイルは1つだけ選択できます。</p>
        </div>

        <div class="file-section">
            <div class="file-section-heading">
                <h3>選択したファイル</h3>
            </div>

            <ul class="file-list" id="fileList">
                <li class="empty-state">選択されたファイルがありません。</li>
            </ul>
        </div>

        <div class="upload-progress" id="progressSection" hidden>
            <div class="loading-indicator">
                <div class="spinner" aria-hidden="true"></div>
                <span id="progressText" role="status" aria-live="polite">
                    アップロード中...
                </span>
            </div>
        </div>

        <div
                class="status-message"
                id="statusMessage"
                role="status"
                aria-live="polite"
        ></div>

        <button
                type="button"
                class="upload-button"
                id="uploadButton"
                disabled
        >
            アップロード開始
        </button>
    </section>

    <footer class="footer">
        ローカルファイルアップロードツール
    </footer>
</main>
</body>
</html>
